name: CI/CD Deploy to AWS Lambda

# Пайплайнът ще се задейства автоматично при всеки push към main бранча
on:
    push:
        branches:
            - main

jobs:
    deploy:
        name: Build and Deploy Project
        runs-on: ubuntu-latest

        steps:
            # Сваля се кода от GitHub   
          - name: Checkout Code
            uses: actions/checkout@v4
            # Логва се в AWS акаунта със Secrets ключовете
          - name: Configure AWS Credentials
            uses: aws-actions/configure-aws-credentials@v4
            with:
                aws-access-key-id: ${{ secrets.BG_WORDLE_ACCESS_KEY_ID }}
                aws-secret-access-key: ${{ secrets.BG_WORDLE_SECRET_KEY }}
                aws-region: eu-central-1
            # Автоматично се логва в Amazon ECR
          - name: Login to Amazon ECR
            id: login-ecr 
            uses: aws-actions/amazon-ecr-login@v2
            # Билдване и пущване на Docker имиджа в Amazon ECR
          - name: Build, Tag, and Push Docker Image
            env:
                ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry}}
                ECR_REPOSITORY: bg-wordle-lambda-project
                IMAGE_TAG: latest
            run: |
                docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
                docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
            # Инсталиране на Terraform
          - name: Setup Terraform
            uses: hashicorp/setup-terraform@v3
            # Изпълнение на Terraform Init и Terraform Apply
          - name: Terraform Init and Apply
            run: |
                terraform init
                terraform apply -auto-approve